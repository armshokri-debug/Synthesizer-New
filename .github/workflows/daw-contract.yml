name: DAW architecture contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/**'
      - 'docs/DAW-ARCHITECTURE-AUDIT.md'
      - 'src/studio/**'
      - 'src/ui/**'
      - '.github/workflows/daw-contract.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: DAW contract (failures must remain visible)
        run: bun test --preload ./tests/vite-worklet-preload.js diagnostics/daw-contract.test.ts
