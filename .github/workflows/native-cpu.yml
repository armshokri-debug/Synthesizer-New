name: Build CPU optimized Mac VST3
on:
  push:
    branches: [main]
    paths: ['native/**', 'plugin/**', '.github/workflows/native-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Verify DSP equivalence on Intel macOS
        run: bash native/tests/perf/check_cpu_fix.sh
      - run: npm ci
      - name: Prepare the existing UI and audio resources
        run: bash plugin/prepare.sh
      - name: Build Release VST3 and host checks
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DSY1_TESTS=ON
          cmake --build plugin/build --config Release --target SY1_VST3 SY1HostTest SY1UiScopeTest SY1UiEventsTest --parallel 3
      - name: Test host and UI queues
        run: |
          ctest --test-dir plugin/build --output-on-failure
          plugin/build/SY1HostTest_artefacts/Release/SY1HostTest
      - name: Validate the VST3 in a real plugin host
        run: |
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o /tmp/pluginval.zip
          ditto -x -k /tmp/pluginval.zip /tmp/pluginval
          /tmp/pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$PWD/plugin/build/SY1_artefacts/Release/VST3/SY-1.vst3"
      - name: Package tested Intel plugin
        run: |
          mkdir -p package/SY1-CPU-Mac/VST3
          ditto plugin/build/SY1_artefacts/Release/VST3/SY-1.vst3 package/SY1-CPU-Mac/VST3/SY-1.vst3
          codesign --force --deep --sign - package/SY1-CPU-Mac/VST3/SY-1.vst3
          codesign --verify --deep --strict package/SY1-CPU-Mac/VST3/SY-1.vst3
          cp plugin/install-cpu.command package/SY1-CPU-Mac/Install.command
          chmod +x package/SY1-CPU-Mac/Install.command
          echo "$GITHUB_SHA" > package/SY1-CPU-Mac/source-commit.txt
          shasum -a 256 package/SY1-CPU-Mac/VST3/SY-1.vst3/Contents/MacOS/SY-1 > package/SY1-CPU-Mac/SHA256.txt
          ditto -c -k --keepParent package/SY1-CPU-Mac SY1-CPU-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SY1-CPU-Mac-Intel
          path: SY1-CPU-Mac.zip
