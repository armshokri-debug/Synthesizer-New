    <style id="tehran-layout-v5">
/* Tehran V5: use the entire MIDI workspace, contain all control readouts. */
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .synth-top{display:none!important}
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .synth-preset-nav{display:none!important}

html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .tehran-actions{position:static!important;display:flex;flex:0 0 auto;margin:0 0 0 auto;gap:6px;align-items:center}
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .tehran-midi{flex:1 1 0;min-height:0;max-height:none;margin:0;align-self:stretch}
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .st-pr{flex:1 1 0;min-height:0}
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=midi] .st-pr-body-scroll{flex:1 1 0;min-height:0;max-height:none}
@media(orientation:landscape) and (min-width:760px){
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=sound]:not([data-page=all]) .synth-sec.is-on-page{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto minmax(0,1fr);align-content:stretch;align-items:center;justify-content:stretch;gap:4px;padding:5px 6px;min-height:0;max-height:none;container-type:size;overflow:visible}
html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=sound]:not([data-page=all]) .synth-sec.is-on-page>h4{grid-column:1/-1;grid-row:1;width:100%;margin:0;padding:0 0 2px;line-height:1.1;font-size:11px}

html:not(.is-plugin) #sy1-panel .synth-panel[data-machine=sy1][data-tehran-view=sound]:not([data-page=all]) .synth-sec.is-on-page>.sk-row{grid-row:4;grid-column:1;align-self:center;justify-self:center;display:flex;flex:none;flex-flow:row nowrap;align-items:start;justify-content:space-evenly;gap:3px;width:100%;max-width:none;min-width:0;min-height:0;height:auto;padding:4px 0 6px;margin:0;position:static}

  <body>
    <div class="sy1-shell">
      <div id="sy1-panel"></div>
      <div id="sy1-studio" hidden></div>
      <div class="kb-area">
        <div class="kb-bar">
          <div class="kb-oct" role="group" aria-label="Octave">
            <button type="button" class="kb-btn kb-oct-btn" id="oct-down" aria-label="Octave down">Oct −</button>
            <span class="kb-range" id="kb-range"></span>
            <button type="button" class="kb-btn kb-oct-btn" id="oct-up" aria-label="Octave up">Oct +</button>
          </div>
          <div class="kb-perf">
            <button type="button" class="kb-btn kb-hold" id="kb-hold" aria-pressed="false" title="Hold: notes keep sounding after you let go">HOLD</button>
            <button type="button" class="kb-btn kb-arp" id="kb-arp" aria-expanded="false" title="Arpeggiator settings">ARP</button>
          </div>
          <div class="kb-strip">
            <button type="button" class="kb-or kb-btn" id="kb-oriental" aria-expanded="false" aria-haspopup="dialog"><span class="kb-or-dot" aria-hidden="true"></span><span class="kb-or-lbl">ORIENTAL</span><span class="kb-or-scale"></span><svg class="kb-or-caret" viewBox="0 0 10 6" width="9" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="kb-scale-notes" id="kb-scale-notes" aria-live="polite"></div>
            <div class="kb-mini" id="kb-mini" role="slider" tabindex="0" aria-label="Keyboard range" aria-valuemin="24" aria-valuemax="84"><span class="kb-mini-keys" aria-hidden="true"></span><span class="kb-mini-win" aria-hidden="true"></span></div>
          </div>
          <div class="kb-machine-badge" id="kb-machine-badge" data-machine="sy1" aria-live="polite">
            <span class="kb-machine-emblem" aria-hidden="true"></span>
            <span class="kb-machine-name" id="kb-machine-name">SY-1</span>
            <span class="kb-machine-sep" aria-hidden="true">·</span>
            <span class="kb-machine-role" id="kb-machine-role">All-rounder</span>
          </div>
        </div>
        <div class="kb-main">
          <div class="kb-wheels">
            <div class="kb-wheel" data-wheel="bend" role="slider" aria-label="Pitch bend" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" style="--v:0.5"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">PB</span></div>
            <div class="kb-wheel" data-wheel="mod" role="slider" aria-label="Modulation" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" style="--v:0"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">MOD</span></div>
          </div>
          <div class="kb-col">
            <div class="kb" id="kb"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
