  <body>
    <div class="sy1-shell">
      <div id="sy1-panel"></div>
      <div id="sy1-studio" hidden></div>
      <div class="kb-area">
        <div class="kb-bar">
          <div class="kb-oct" role="group" aria-label="Octave">
            <button type="button" class="kb-btn kb-oct-btn" id="oct-down" aria-label="Octave down">Oct −</button>
            <span class="kb-range" id="kb-range"></span>
            <button type="button" class="kb-btn kb-oct-btn" id="oct-up" aria-label="Octave up">Oct +</button>
          </div>
          <div class="kb-perf">
            <button type="button" class="kb-btn kb-hold" id="kb-hold" aria-pressed="false" title="Hold: notes keep sounding after you let go">HOLD</button>
            <button type="button" class="kb-btn kb-arp" id="kb-arp" aria-expanded="false" title="Arpeggiator settings">ARP</button>
          </div>
          <div class="kb-strip">
            <button type="button" class="kb-or kb-btn" id="kb-oriental" aria-expanded="false" aria-haspopup="dialog"><span class="kb-or-dot" aria-hidden="true"></span><span class="kb-or-lbl">ORIENTAL</span><span class="kb-or-scale"></span><svg class="kb-or-caret" viewBox="0 0 10 6" width="9" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="kb-scale-notes" id="kb-scale-notes" aria-live="polite"></div>
            <div class="kb-mini" id="kb-mini" role="slider" tabindex="0" aria-label="Keyboard range" aria-valuemin="24" aria-valuemax="84"><span class="kb-mini-keys" aria-hidden="true"></span><span class="kb-mini-win" aria-hidden="true"></span></div>
          </div>
          <button type="button" id="tehran-keys-size" class="kb-btn" aria-pressed="false" aria-label="Toggle compact keyboard" title="Toggle half-height keyboard for more editing space"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.5" y="4.5" width="13" height="8" rx="1.5"/><path d="M5 4.5v8M8 4.5v8M11 4.5v8M5 1.5h6M8 1.5v2"/></svg><span>Keys ½</span></button>
          <div class="kb-machine-badge" id="kb-machine-badge" data-machine="sy1" aria-live="polite">
            <span class="kb-machine-emblem" aria-hidden="true"></span>
            <span class="kb-machine-name" id="kb-machine-name">SY-1</span>
            <span class="kb-machine-sep" aria-hidden="true">·</span>
            <span class="kb-machine-role" id="kb-machine-role">All-rounder</span>
          </div>
        </div>
        <div class="kb-main">
          <div class="kb-wheels">
            <div class="kb-wheel" data-wheel="bend" role="slider" aria-label="Pitch bend" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" style="--v:0.5"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">PB</span></div>
            <div class="kb-wheel" data-wheel="mod" role="slider" aria-label="Modulation" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" style="--v:0"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">MOD</span></div>
          </div>
          <div class="kb-col">
            <div class="kb" id="kb"></div>
          </div>
        </div>
      </div>
    </div>
  <script id="tehran-dock-v8">
/* Geometry only: keep original controls in the synth panel so every existing
   delegated click handler, preset update and Studio transition stays intact. */
(()=>{
 const shell=document.querySelector('.sy1-shell'),host=document.getElementById('sy1-panel'),bar=document.querySelector('.kb-bar'),orient=document.getElementById('kb-oriental'),strip=document.querySelector('.kb-strip');
 if(!shell||!host||!bar||!orient||!strip)return;
 let pending=0,watchedPanel=null;
 const refresh=()=>{
  pending=0;
  const panel=host.querySelector('.synth-panel:is([data-machine=sy1],[data-machine=yazd],[data-machine=tabriz])[data-tehran-view=main]');
  if(watchedPanel!==panel){if(watchedPanel)ro?.unobserve(watchedPanel);watchedPanel=panel;if(panel)ro?.observe(panel);}
  if(!panel||host.hidden||document.documentElement.classList.contains('is-plugin')||!window.matchMedia('(orientation: landscape) and (min-width: 760px)').matches){delete shell.dataset.tehranDocked;return;}
  const pr=panel.getBoundingClientRect(),br=bar.getBoundingClientRect(),sr=strip.getBoundingClientRect(),or=orient.getBoundingClientRect();
  const start=Math.ceil(Math.max(sr.right,or.right))+8,end=Math.floor(br.right)-8,space=end-start-72-12;
  if(!pr.width||!br.width||space<170){delete shell.dataset.tehranDocked;return;}
  const set=(name,value)=>{const v=Math.round(value)+'px';if(shell.style.getPropertyValue(name)!==v)shell.style.setProperty(name,v)};
  set('--tehran-dock-y',br.top-pr.top-panel.clientTop+(br.height-36)/2);
  set('--tehran-studio-x',start-pr.left-panel.clientLeft);
  set('--tehran-dock-right',pr.right-panel.clientLeft-end);
  set('--tehran-preset-width',Math.min(244,space));
  shell.dataset.tehranDocked='true';
 };
 const schedule=()=>{if(!pending)pending=requestAnimationFrame(refresh)};
 const ro=typeof ResizeObserver==='function'?new ResizeObserver(schedule):null;
 for(const e of [bar,orient,strip])ro?.observe(e);
 new MutationObserver(schedule).observe(host,{childList:true,attributes:true,attributeFilter:['hidden','data-studio-instrument']});
 window.addEventListener('resize',schedule,{passive:true});
 document.addEventListener('sy1-view-change',schedule);
 schedule();
})();
</script>
  <script id="tehran-keys-v10">
(()=>{const b=document.getElementById('tehran-keys-size'),shell=document.querySelector('.sy1-shell');if(!b||!shell)return;b.addEventListener('click',()=>{const compact=shell.dataset.tehranCompact!=='true';shell.dataset.tehranCompact=String(compact);b.setAttribute('aria-pressed',String(compact));b.querySelector('span').textContent=compact?'Keys Full':'Keys ½';});})();
</script>
  <script>window.addEventListener('DOMContentLoaded',()=>{const instrument=new URLSearchParams(location.search).get('instrument');if(['yazd','tabriz'].includes(instrument)&&window.SY1&&!document.documentElement.classList.contains('is-plugin'))window.SY1.setMachine(instrument);});</script>
